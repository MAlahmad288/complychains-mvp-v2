version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complychains
      POSTGRES_PASSWORD: complychains
      POSTGRES_DB: complychains
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://complychains:complychains@postgres:5432/complychains?schema=public
      JWT_SECRET: local-dev-secret-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  postgres_data: